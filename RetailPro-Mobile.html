<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetailPro">
<title>RetailPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e3e7ef; --text:#0f172a; --muted:#64748b;
  --accent:#f59e0b; --accent-ink:#1a1204;
  --green:#16a34a; --blue:#0284c7; --amber:#d97706; --red:#dc2626; --inkc:#0f172a;
  --chip-green:#dcfce7; --chip-blue:#e0f2fe; --chip-amber:#fef3c7; --chip-red:#fee2e2; --chip-ink:#eceff4;
  --side:#0a0e14; --side-text:#cfd6e2; --side-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1222; --surface:#111c33; --surface-2:#0e1730; --line:rgba(255,255,255,.09); --text:#e8eefc; --muted:#8fa0bd;
    --green:#34d399; --blue:#38bdf8; --amber:#fbbf24; --red:#f87171; --inkc:#94a3b8;
    --chip-green:rgba(52,211,153,.14); --chip-blue:rgba(56,189,248,.14); --chip-amber:rgba(251,191,36,.14); --chip-red:rgba(248,113,113,.14); --chip-ink:rgba(148,163,184,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1222; --surface:#111c33; --surface-2:#0e1730; --line:rgba(255,255,255,.09); --text:#e8eefc; --muted:#8fa0bd;
  --green:#34d399; --blue:#38bdf8; --amber:#fbbf24; --red:#f87171; --inkc:#94a3b8;
  --chip-green:rgba(52,211,153,.14); --chip-blue:rgba(56,189,248,.14); --chip-amber:rgba(251,191,36,.14); --chip-red:rgba(248,113,113,.14); --chip-ink:rgba(148,163,184,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter','Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Vazirmatn','Inter',Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.ic.lg{width:24px;height:24px}
.flip{transition:transform .15s}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.collapsed .flip{transform:scaleX(-1)}
html[dir="rtl"] .collapsed .flip{transform:none}

.app{display:flex;height:100%}
.side{width:260px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;transition:width .18s ease}
.collapsed .side{width:78px}
.collapsed .lbl,.collapsed .brand-txt,.collapsed .ver{display:none}
.collapsed .nav button{justify-content:center;padding-inline:0}
.collapsed .brand{justify-content:center}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:17px;color:#fff;line-height:1.2}
.brand-sub{font-size:11px;color:#8b95a7}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;color:var(--side-text);border-radius:10px;text-align:start;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--side-line);padding:12px 6px 2px;margin-top:12px;font-size:11px;color:#8b95a7}
.collapsed .side-foot{justify-content:center}
.side-foot .icon-btn{color:#aab4c5}

.main{flex:1;min-width:0;overflow:auto;padding:0 24px 40px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:16px 0 8px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.tb-mid{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tb-end{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:9px;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.menu-btn{display:none}
.pill{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--surface-2);font-size:13px;color:var(--text)}
.pill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:0;cursor:pointer;font-size:13px;color:inherit;padding:0;max-width:130px}
select option{background:var(--surface);color:var(--text)}
.pill.big{padding:8px 12px;background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.bell-wrap{position:relative}
.badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.pop{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;z-index:30}
.pop h4{margin:4px 6px 8px;font-size:13px}
.pop .row{display:flex;justify-content:space-between;gap:10px;padding:7px 6px;border-radius:8px;font-size:13px}
.pop .row:nth-child(odd){background:var(--surface-2)}
.pop .qty{color:var(--red);font-weight:600;white-space:nowrap}

.page{padding-top:8px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:14px 0 6px}
h1{font-size:26px;line-height:1.2;margin:0}
h2.sec{font-size:16px;margin:30px 0 12px;font-weight:600}
.muted{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--tone,transparent);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-height:96px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-label{color:var(--muted);font-size:13px}
.chip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--chipbg,var(--chip-ink));color:var(--chipfg,var(--muted))}
.card-val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.card-val.neg{color:var(--red)}
.cur{font-size:15px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.tone-green{--tone:var(--green);--chipbg:var(--chip-green);--chipfg:var(--green)}
.tone-blue{--tone:var(--blue);--chipbg:var(--chip-blue);--chipfg:var(--blue)}
.tone-amber{--tone:var(--amber);--chipbg:var(--chip-amber);--chipfg:var(--amber)}
.tone-red{--tone:var(--red);--chipbg:var(--chip-red);--chipfg:var(--red)}
.tone-ink{--tone:var(--inkc);--chipbg:var(--chip-ink);--chipfg:var(--inkc)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;border-radius:14px;border:1px dashed var(--accent);background:var(--chip-amber)}
.banner strong{display:block;margin-bottom:2px}
.banner p{margin:0;color:var(--muted);max-width:60ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(.95)}
.btn-danger{color:var(--red)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:6px;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:14px}
.form{display:grid;gap:16px;max-width:460px}
.form label{display:grid;gap:6px;font-weight:500}
.form input,.form select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;outline:0;width:100%}
.form input:focus,.form select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.f{color:var(--muted);font-size:12px;direction:ltr;text-align:left}
td.n{font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(2,6,15,.55);display:grid;place-items:center;z-index:100;padding:20px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.dlg p{margin:0 0 16px}
.dlg-act{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:90vw;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:120;font-size:13px;box-shadow:var(--shadow)}
.backdrop{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .main{padding:0 14px 32px}
  .menu-btn{display:grid}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:50;width:272px;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  html[dir="rtl"] .side{transform:translateX(105%)}
  .mobile-open .side{transform:none}
  .mobile-open .backdrop{display:block;position:fixed;inset:0;background:rgba(2,6,15,.5);z-index:40}
  .collapsed .side{width:272px}
  .collapsed .lbl,.collapsed .brand-txt,.collapsed .ver{display:revert}
  .collapsed .nav button{justify-content:flex-start;padding-inline:12px}
  .side-foot .icon-btn{display:none}
  .tb-mid{display:none}
}
@media (max-width:640px){
  .g4,.g3{grid-template-columns:1fr}
  .page-head{flex-direction:column}
  h1{font-size:22px}
  .tb-end .pill:not(.icon-pill){display:none}
  .card-val{font-size:24px}
}
.btn{display:inline-flex;align-items:center;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 12px}
.toolbar .grow{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.toolbar .grow input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.sub{font-size:12px;color:var(--muted);direction:ltr;text-align:start}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500}
.tag.ok{background:var(--chip-green);color:var(--green)}
.tag.off{background:var(--chip-ink);color:var(--muted)}
.tag.warn{background:var(--chip-red);color:var(--red)}
.stk.low{color:var(--red);font-weight:700}
td.neg{color:var(--red)}
td.act{white-space:nowrap;text-align:end}
.count-note{margin:10px 2px 0;font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.fgrid label,.catadd label{display:grid;gap:6px;font-weight:500}
.fgrid input,.fgrid select,.dlg input.txt{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;outline:0;width:100%}
.fgrid input:focus,.fgrid select:focus,.dlg input.txt:focus{border-color:var(--accent)}
.fgrid .chk{display:flex;align-items:center;gap:8px}
.fgrid .chk input{width:auto}
.dlg.wide{max-width:620px;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 16px;font-size:18px}
.dlg .sec-sub{margin:18px 0 10px;font-weight:600}
.err{color:var(--red);margin:12px 0 0;font-size:13px;min-height:1.2em}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.catrow input{flex:1}
.catrow .n{color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:4px}
.gcard.sel{outline:2px solid var(--accent);outline-offset:-1px}
.gcard h3{margin:0;font-size:16px}
.gact{display:flex;gap:2px;margin:-6px -8px 0 0}
html[dir="rtl"] .gact{margin:-6px 0 0 -8px}
.gstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 14px}
.gstats span{display:block;font-size:12px;color:var(--muted)}
.gstats strong{font-size:15px}
.gcard .btn{align-self:flex-start}
td.sgn-in{color:var(--green);font-weight:600}
td.sgn-out{color:var(--red);font-weight:600}
.avail{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip-btn{padding:6px 12px;font-size:13px}
.gstats.c3{grid-template-columns:repeat(3,1fr)}
.neg-t{color:var(--red)}
.pos-t{color:var(--green)}
.dlg .tbl-wrap{margin-bottom:6px}
@media (max-width:640px){.gstats.c3{grid-template-columns:1fr}}


/* ===== RETAILPRO MOBILE EDITION ===== */
@media (max-width: 640px){
  html,body{width:100%;min-width:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{font-size:14px;padding:0}
  .app{min-height:100dvh;height:100dvh;width:100%;display:block;overflow:hidden}
  .side{position:fixed;inset:0 auto 0 0;width:282px!important;max-width:88vw;height:100dvh;z-index:50;transform:translateX(-105%);transition:transform .22s ease;box-shadow:18px 0 45px rgba(0,0,0,.28);padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
  html[dir="rtl"] .side{inset:0 0 0 auto;transform:translateX(105%);box-shadow:-18px 0 45px rgba(0,0,0,.28)}
  .mobile-open .side{transform:translateX(0)!important}
  .mobile-open .backdrop{display:block!important;position:fixed;inset:0;background:rgba(2,6,15,.62);z-index:40;backdrop-filter:blur(2px)}
  .main{width:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;padding:0 10px calc(92px + env(safe-area-inset-bottom))}
  .topbar{position:sticky;top:0;z-index:30;margin:0 -10px 8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-radius:0 0 14px 14px;gap:7px;min-height:58px}
  .menu-btn{display:grid!important;width:40px;height:40px;flex:none;background:var(--surface-2)}
  .search{height:40px;padding:0 9px;border-radius:11px}
  .search input{font-size:13px}
  .tb-end{gap:3px}
  .tb-end .pill:not(.icon-pill),.tb-end .avatar{display:none}
  .icon-pill{display:grid!important;width:40px;height:40px;padding:0;place-items:center}
  .icon-pill select{position:absolute;opacity:0;width:40px;height:40px}
  .tb-end .icon-btn{width:40px;height:40px}
  .page{padding-top:2px}
  .page-head{margin:12px 0 10px;gap:10px}
  h1{font-size:21px}
  h2.sec{font-size:15px;margin:22px 0 10px}
  .muted{font-size:12px}
  .g4,.g3{grid-template-columns:1fr!important;gap:10px}
  .card{min-height:86px;padding:13px 14px;border-radius:13px}
  .card-val{font-size:22px}
  .banner{padding:13px;gap:10px}
  .btn{min-height:42px;padding:10px 13px;border-radius:11px;touch-action:manipulation}
  .btn-row{gap:8px}
  .btn-row .btn{flex:1;min-width:120px}
  .toolbar{gap:8px;margin:12px 0 10px}
  .toolbar .grow{min-width:100%;height:44px}
  .panel{border-radius:13px;padding:13px}
  .tbl-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:11px}
  table{min-width:680px;font-size:12px}
  th,td{padding:9px 8px;white-space:nowrap}
  .fgrid{grid-template-columns:1fr!important;gap:10px}
  .fgrid input,.fgrid select,.dlg input.txt{min-height:44px;font-size:16px}
  textarea{font-size:14px!important;min-height:130px}
  .dlg{width:min(94vw,620px)!important;max-height:88dvh!important;margin:auto;border-radius:16px;padding:16px}
  .modal{padding:10px}
  .gstats,.gstats.c3{grid-template-columns:1fr 1fr!important;gap:8px}
  .gcard{padding:12px}
  .gact{margin-top:-4px}
  .pop{position:fixed;top:62px;inset-inline:10px auto;width:calc(100vw - 20px);max-width:none}
  .bottom-nav{display:grid}
}
@media (min-width:641px){.bottom-nav{display:none!important}}
/* mobile bottom navigation */
.bottom-nav{position:fixed;display:none;z-index:35;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));height:62px;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.10);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.28);grid-template-columns:repeat(4,1fr);padding:5px;backdrop-filter:blur(14px)}
.bottom-nav button{border:0;background:transparent;color:#aeb8c8;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-width:0}
.bottom-nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.bottom-nav .bn-icon{font-size:18px;line-height:1}
@media (max-width:380px){.bottom-nav{left:6px;right:6px}.bottom-nav button{font-size:9px}.bottom-nav .bn-icon{font-size:17px}}

</style>
</head>
<body>
<div id="root"></div>
<div class="bottom-nav" id="bottomNav">
  <button data-bnav="dashboard" class="on"><span class="bn-icon">⌂</span><span>خانه</span></button>
  <button data-bnav="products"><span class="bn-icon">▦</span><span>کالا</span></button>
  <button data-bnav="sales"><span class="bn-icon">▤</span><span>فروش</span></button>
  <button data-bnav="settings"><span class="bn-icon">⚙</span><span>تنظیمات</span></button>
</div>

<script>
/* ===================== DATA LAYER (database + calculations) ===================== */
var RP = (function(){
'use strict';
var LS_KEY='retailpro_db_v1';
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

var TABLES=['godowns','categories','products','stock','stock_moves','customers','customer_payments','suppliers','supplier_tx','staff','staff_tx','sales','sale_items','refunds','expenses','loans','activity_log','trash'];
var SCHEMA={
  godowns:'id, name, location',
  categories:'id, name',
  products:'id, name, sku, barcode, category_id, unit, bag_kg, cost_price, sale_price, min_stock, active',
  stock:'id, product_id, godown_id, qty',
  stock_moves:'id, product_id, godown_id, type (in | out | transfer_in | transfer_out), qty, reason, note, date, ref',
  customers:'id, name, phone, address, active',
  customer_payments:'id, customer_id, amount, date, note',
  suppliers:'id, name, phone, company, address',
  supplier_tx:'id, supplier_id, type (purchase | payment), amount, note, date',
  staff:'id, name, role, phone, salary, hired_at, active',
  staff_tx:'id, staff_id, type (accrual | payment), amount, reason, note, date',
  sales:'id, invoice_no, customer_id, godown_id, date, subtotal, discount, total, paid',
  sale_items:'id, sale_id, product_id, qty, price, cost',
  refunds:'id, sale_id, amount, reason, date',
  expenses:'id, category, amount, note, date',
  loans:'id, party, direction (given | taken), amount, paid, date, due_date, note',
  activity_log:'id, action, table_name, row_id, at',
  trash:'id, table_name, row, deleted_at'
};

var DB={
  data:null,
  blank:function(){
    var d={version:1,settings:{shopName:'RetailPro',currency:'\u060B',currencyCode:'AFN',openingCash:0,lang:'en',theme:'auto'},seq:{}};
    TABLES.forEach(function(t){d[t]=[];d.seq[t]=0});
    return d;
  },
  fill:function(d){
    var b=this.blank();
    if(!d.seq||typeof d.seq!=='object')d.seq={};
    TABLES.forEach(function(t){
      if(!Array.isArray(d[t]))d[t]=[];
      if(typeof d.seq[t]!=='number')d.seq[t]=d[t].reduce(function(m,r){return Math.max(m,r.id||0)},0);
    });
    d.settings=Object.assign(b.settings,d.settings||{});
    d.version=1;
    return d;
  },
  load:function(){
    var raw=safeGet(LS_KEY),d=null;
    if(raw){try{d=JSON.parse(raw)}catch(e){d=null}}
    this.data=(d&&typeof d==='object'&&d.version===1)?this.fill(d):this.blank();
  },
  save:function(){safeSet(LS_KEY,JSON.stringify(this.data))},
  all:function(t){return this.data[t]},
  get:function(t,id){return this.data[t].find(function(r){return r.id===id})||null},
  count:function(t){return this.data[t].length},
  setStock:function(pid,gid,qty,reason){
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});
    var cur=r?r.qty:0;
    if(r){r.qty=qty;this.log('update','stock',r.id);this.save()}
    else r=this.insert('stock',{product_id:pid,godown_id:gid,qty:qty});
    var diff=Math.round((qty-cur)*1000)/1000;
    if(diff!==0)this.insert('stock_moves',{product_id:pid,godown_id:gid,type:diff>0?'in':'out',qty:Math.abs(diff),reason:reason||'',note:'',date:new Date().toISOString(),ref:null});
    return r;
  },
  adjustStock:function(pid,gid,delta,type,note,ref){
    delta=Math.round(delta*1000)/1000;
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});
    var nq=Math.round(((r?r.qty:0)+delta)*1000)/1000;
    if(nq<0||delta===0)return false;
    if(r){r.qty=nq;this.log('update','stock',r.id)}else this.insert('stock',{product_id:pid,godown_id:gid,qty:nq});
    this.insert('stock_moves',{product_id:pid,godown_id:gid,type:type,qty:Math.abs(delta),reason:'',note:note||'',date:new Date().toISOString(),ref:ref||null});
    this.save();return true;
  },
  transfer:function(pid,from,to,qty,note){
    qty=Math.round(qty*1000)/1000;
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===from});
    if(from===to||!(qty>0)||!r||r.qty<qty)return false;
    var ref=this.data.seq.stock_moves+1;
    this.adjustStock(pid,from,-qty,'transfer_out',note,ref);
    this.adjustStock(pid,to,qty,'transfer_in',note,ref);
    return true;
  },
  nextSku:function(){
    var m=0;
    this.data.products.forEach(function(p){var x=/^P-(\d+)$/.exec(p.sku||'');if(x)m=Math.max(m,+x[1])});
    return 'P-'+String(m+1).padStart(3,'0');
  },
  log:function(action,t,id){
    if(t==='activity_log'||t==='trash')return;
    var L=this.data.activity_log;
    L.push({id:++this.data.seq.activity_log,action:action,table_name:t,row_id:id,at:new Date().toISOString()});
    if(L.length>500)L.splice(0,L.length-500);
  },
  insert:function(t,row){
    var r=Object.assign({},row);
    r.id=++this.data.seq[t];
    if(!r.created_at)r.created_at=new Date().toISOString();
    this.data[t].push(r);
    this.log('insert',t,r.id);this.save();return r;
  },
  update:function(t,id,patch){
    var r=this.get(t,id);if(!r)return null;
    Object.assign(r,patch,{updated_at:new Date().toISOString()});
    this.log('update',t,id);this.save();return r;
  },
  remove:function(t,id){
    var i=this.data[t].findIndex(function(r){return r.id===id});
    if(i<0)return false;
    var row=this.data[t].splice(i,1)[0];
    this.data.trash.push({id:++this.data.seq.trash,table_name:t,row:row,deleted_at:new Date().toISOString()});
    this.log('delete',t,id);this.save();return true;
  },
  restore:function(trashId){
    var i=this.data.trash.findIndex(function(r){return r.id===trashId});
    if(i<0)return false;
    var x=this.data.trash.splice(i,1)[0];
    this.data[x.table_name].push(x.row);
    this.log('restore',x.table_name,x.row.id);this.save();return true;
  },
  exportText:function(){return JSON.stringify(this.data,null,2)},
  importText:function(text){
    var d;
    try{d=JSON.parse(text)}catch(e){return false}
    if(!d||typeof d!=='object'||d.version!==1)return false;
    for(var i=0;i<TABLES.length;i++){if(d[TABLES[i]]!==undefined&&!Array.isArray(d[TABLES[i]]))return false}
    this.data=this.fill(d);this.save();return true;
  },
  clearAll:function(){
    var s=this.data.settings;
    this.data=this.blank();
    this.data.settings=Object.assign(this.data.settings,s);
    this.save();
  },
  loadDemo:function(){
    this.data=buildDemo(this.data.settings);
    this.save();
  }
};

/* ---------- calculations ---------- */
function sum(arr,fn){var s=0;for(var i=0;i<arr.length;i++)s+=fn(arr[i]);return s}
function periodStart(p){
  var n=new Date();
  if(p==='today')return new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='weekly')return new Date(Date.now()-7*864e5);
  if(p==='monthly')return new Date(Date.now()-30*864e5);
  if(p==='yearly')return new Date(Date.now()-365*864e5);
  return null;
}
function productStock(D,gid){
  var m={};
  D.stock.forEach(function(r){if(gid==='all'||r.godown_id===gid)m[r.product_id]=(m[r.product_id]||0)+r.qty});
  return m;
}
function compute(D,period,gid){
  var from=periodStart(period);
  function inR(iso){return !from||new Date(iso)>=from}
  function gOK(g){return gid==='all'||g===gid}
  var sales=D.sales.filter(function(s){return inR(s.date)&&gOK(s.godown_id)});
  var costBy={};D.sale_items.forEach(function(i){costBy[i.sale_id]=(costBy[i.sale_id]||0)+i.cost*i.qty});
  var saleById={};D.sales.forEach(function(s){saleById[s.id]=s});
  var revenue=sum(sales,function(s){return s.total});
  var gross=sum(sales,function(s){return s.total-(costBy[s.id]||0)});
  // Pending = what customers still owe in total (all bills minus money already received). Not limited to the period.
  var pending=sum(D.sales,function(s){return s.total-s.paid})-sum(D.customer_payments,function(x){return x.amount});
  var refunds=sum(D.refunds.filter(function(r){var s=saleById[r.sale_id];return inR(r.date)&&s&&gOK(s.godown_id)}),function(r){return r.amount});
  var expenses=sum(D.expenses.filter(function(e){return inR(e.date)}),function(e){return e.amount});
  var staffPaid=sum(D.staff_tx.filter(function(x){return x.type==='payment'&&inR(x.date)}),function(x){return x.amount});
  var net=gross-expenses-refunds,pure=net-staffPaid;

  var cash=(D.settings.openingCash||0)
    +sum(D.sales,function(s){return s.paid})
    +sum(D.customer_payments,function(x){return x.amount})
    -sum(D.refunds,function(r){return r.amount})
    -sum(D.expenses,function(e){return e.amount})
    -sum(D.supplier_tx.filter(function(x){return x.type==='payment'}),function(x){return x.amount})
    +sum(D.supplier_tx.filter(function(x){return x.type==='purchase'}),function(){return 0})
    -sum(D.staff_tx.filter(function(x){return x.type==='payment'}),function(x){return x.amount})
    +sum(D.loans,function(l){return l.direction==='taken'?(l.amount-l.paid):-(l.amount-l.paid)});

  var supBal={};
  D.supplier_tx.forEach(function(x){supBal[x.supplier_id]=(supBal[x.supplier_id]||0)+(x.type==='purchase'?x.amount:-x.amount)});
  var payables=0,receivables=0;
  Object.keys(supBal).forEach(function(k){if(supBal[k]>0)payables+=supBal[k];else receivables+=-supBal[k]});

  var stk=productStock(D,gid),active=D.products.filter(function(p){return p.active});
  var qty=sum(active,function(p){return stk[p.id]||0});
  var kg=sum(active,function(p){var q=stk[p.id]||0;return p.unit==='bag'&&p.bag_kg>0?q*p.bag_kg:(p.unit==='kg'?q:0)});
  var value=sum(active,function(p){return (stk[p.id]||0)*p.cost_price});

  var due={};
  D.staff_tx.forEach(function(x){due[x.staff_id]=(due[x.staff_id]||0)+(x.type==='accrual'?x.amount:-x.amount)});
  var staffPayable=0;Object.keys(due).forEach(function(k){if(due[k]>0)staffPayable+=due[k]});

  return {revenue:revenue,cash:cash,net:net,pure:pure,sales:sales.length,expenses:expenses,pending:pending,refunds:refunds,
    customers:D.customers.filter(function(c){return c.active!==false}).length,payables:payables,receivables:receivables,netbal:receivables-payables,
    active_products:active.length,stock_qty:qty,stock_kg:kg,stock_value:value,staff_total:D.staff.filter(function(s){return s.active!==false}).length,staff_payable:staffPayable,staff_paid:staffPaid};
}
function customerStats(D){
  var m={};
  D.customers.forEach(function(c){m[c.id]={bills:0,total:0,paid:0,received:0,balance:0,last:''}});
  D.sales.forEach(function(s){var x=m[s.customer_id];if(!x)return;x.bills++;x.total+=s.total;x.paid+=s.paid;if(s.date>x.last)x.last=s.date});
  D.customer_payments.forEach(function(p){var x=m[p.customer_id];if(x)x.received+=p.amount});
  Object.keys(m).forEach(function(k){var x=m[k];x.balance=Math.round((x.total-x.paid-x.received)*100)/100});
  return m;
}
function staffBalances(D){
  var m={};
  D.staff.forEach(function(s){m[s.id]={accrued:0,paid:0,balance:0}});
  D.staff_tx.forEach(function(x){var r=m[x.staff_id];if(!r)return;if(x.type==='accrual')r.accrued+=x.amount;else r.paid+=x.amount});
  Object.keys(m).forEach(function(k){var r=m[k];r.balance=Math.round((r.accrued-r.paid)*100)/100});
  return m;
}
function lowStock(D){
  var stk=productStock(D,'all');
  return D.products.filter(function(p){return p.active&&(stk[p.id]||0)<=p.min_stock}).map(function(p){return {id:p.id,name:p.name,qty:stk[p.id]||0,min:p.min_stock}});
}

return {DB:DB,TABLES:TABLES,SCHEMA:SCHEMA,compute:compute,lowStock:lowStock,customerStats:customerStats,staffBalances:staffBalances};
})();
</script>

<script>

  return new Promise(function(res){
    var o=document.createElement('div');o.className='modal';
    o.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="dlg-act"><button class="btn" data-r="0">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="1">'+esc(t('confirm'))+'</button></div></div>';
    o.addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(b||e.target===o){o.remove();res(!!b&&b.dataset.r==='1')}});
    document.body.appendChild(o);o.querySelector('[data-r="1"]').focus();
  });
}

var UNITS=['pcs','kg','bag','can','pack','bottle','box','liter','meter','dozen'];

function unitLabel(u){var v=t('unit_'+u);return v==='unit_'+u?u:v}
function unitFull(p){var u=unitLabel(p.unit);return p.unit==='bag'&&p.bag_kg>0?u+' '+qtyFmt(p.bag_kg)+' '+t('unit_kg'):u}
function weightKg(p,q){return p.unit==='bag'&&p.bag_kg>0?q*p.bag_kg:(p.unit==='kg'?q:0)}
function tonFmt(kg){return qtyFmt(kg/1000)}
function kgText(p,q){
  var isBag=p.unit==='bag'&&p.bag_kg>0;
  if(!isBag&&p.unit!=='kg')return '';
  var k=weightKg(p,q);
  return '= '+(isBag?qtyFmt(k)+' '+t('unit_kg')+' = ':'')+tonFmt(k)+' '+t('unit_ton');
}
function kgSub(p,q){var k=kgText(p,q);return k?'<div class="sub"><bdi dir="ltr">'+esc(k)+'</bdi></div>':''}
function qtyText(p,q){var k=kgText(p,q);return qtyFmt(q)+' '+unitLabel(p.unit)+(k?' ('+k+')':'')}
function availText(pid,gid){var pr=DB.get('products',pid),q=avail(pid,gid);return t('tf_avail').replace('{n}',pr?qtyText(pr,q):qtyFmt(q))}
function qtyFmt(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:3})}
function productTotals(){var m={};DB.data.stock.forEach(function(r){m[r.product_id]=(m[r.product_id]||0)+r.qty});return m}
function prodFilter(){
  var D=DB.data,q=state.pq.trim().toLowerCase(),tot=productTotals();
  return D.products.filter(function(p){
    if(state.pcat!=='all'&&String(p.category_id||'')!==String(state.pcat))return false;
    var low=p.active&&(tot[p.id]||0)<=p.min_stock;
    if(state.pstat==='active'&&!p.active)return false;
    if(state.pstat==='inactive'&&p.active)return false;
    if(state.pstat==='low'&&!low)return false;
    if(q&&(p.name||'').toLowerCase().indexOf(q)<0&&(p.sku||'').toLowerCase().indexOf(q)<0&&(p.barcode||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
}
function productRows(list){
  var D=DB.data,tot=productTotals(),perG={},cat={},gname={};
  D.stock.forEach(function(r){(perG[r.product_id]=perG[r.product_id]||[]).push(r)});
  D.categories.forEach(function(c){cat[c.id]=c.name});
  D.godowns.forEach(function(g){gname[g.id]=g.name});
  if(!list.length)return '<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(p){
    var q=tot[p.id]||0,low=p.active&&q<=p.min_stock,profit=p.sale_price-p.cost_price,pct=p.cost_price>0?Math.round(profit/p.cost_price*100):0;
    var tip=(perG[p.id]||[]).map(function(r){return (gname[r.godown_id]||'?')+': '+qtyFmt(r.qty)}).join(' | ');
    return '<tr><td><strong>'+esc(p.name)+'</strong><div class="sub">'+esc(p.sku||'')+(p.barcode?' \u00B7 '+esc(p.barcode):'')+'</div></td>'
     +'<td>'+esc(cat[p.category_id]||'\u2014')+'</td><td>'+esc(unitFull(p))+'</td>'
     +'<td class="n"><bdi dir="ltr">'+fmt(p.cost_price)+'</bdi></td><td class="n"><bdi dir="ltr">'+fmt(p.sale_price)+'</bdi></td>'
     +'<td class="n'+(profit<0?' neg':'')+'"><bdi dir="ltr">'+fmt(profit)+' ('+pct+'%)</bdi></td>'
     +'<td class="n" title="'+esc(tip)+'"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(q)+'</bdi></span>'+kgSub(p,q)+'</td>'
     +'<td><span class="tag '+(p.active?'ok':'off')+'">'+esc(t(p.active?'active':'inactive'))+'</span>'+(low?' <span class="tag warn">'+esc(t('low'))+'</span>':'')+'</td>'
     +'<td class="act"><button class="icon-btn" data-act="pedit" data-id="'+p.id+'" aria-label="'+esc(t('edit'))+'">'+ic('edit')+'</button><button class="icon-btn" data-act="pdel" data-id="'+p.id+'" aria-label="'+esc(t('delete'))+'">'+ic('trash')+'</button></td></tr>';
  }).join('');
}
function countNote(list){return list.length>200?t('showing').replace('{a}',200).replace('{b}',list.length):''}
function refreshProductList(){
  var b=document.getElementById('prodBody');if(!b)return;
  var list=prodFilter();b.innerHTML=productRows(list);
  var n=document.getElementById('prodCount');if(n)n.textContent=countNote(list);
}

function openModal(html,wide){
  var o=document.createElement('div');o.className='modal';
  o.innerHTML='<div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(o);
  o.close=function(){o.remove()};
  return o;
}
function numVal(v){v=String(v).trim();return v===''?0:parseFloat(v)}

function openProductForm(id){
  var D=DB.data,p=id?DB.get('products',id):null;
  if(!D.godowns.length)DB.insert('godowns',{name:t('main_godown'),location:''});
  var st={};if(p)D.stock.forEach(function(r){if(r.product_id===p.id)st[r.godown_id]=r.qty});
  var cOpts='<option value="">'+esc(t('no_category'))+'</option>'+D.categories.map(function(x){return '<option value="'+x.id+'"'+(p&&p.category_id===x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'<option value="__new">'+esc(t('new_category'))+'</option>';
  var uOpts=UNITS.map(function(u){return '<option value="'+u+'"'+((p?p.unit:'pcs')===u?' selected':'')+'>'+esc(unitLabel(u))+'</option>'}).join('');
  var gInputs=D.godowns.map(function(g){return '<label>'+esc(t('stock_in').replace('{g}',g.name))+'<input class="pf_g" data-g="'+g.id+'" type="number" inputmode="decimal" min="0" step="any" value="'+(st[g.id]!==undefined?st[g.id]:0)+'"></label>'}).join('');
  var o=openModal('<h3>'+esc(t(p?'form_edit':'form_add'))+'</h3><div class="fgrid">'
   +'<label class="full">'+esc(t('name'))+'<input id="pf_name" value="'+esc(p?p.name:'')+'" autocomplete="off"></label>'
   +'<label>'+esc(t('sku'))+'<input id="pf_sku" dir="ltr" placeholder="'+esc(t('sku_ph'))+'" value="'+esc(p?p.sku:'')+'"></label>'
   +'<label>'+esc(t('barcode'))+'<input id="pf_bc" dir="ltr" inputmode="numeric" value="'+esc(p?p.barcode:'')+'"></label>'
   +'<label>'+esc(t('category'))+'<select id="pf_cat">'+cOpts+'</select></label>'
   +'<label>'+esc(t('unit'))+'<select id="pf_unit">'+uOpts+'</select></label>'
   +'<div class="full" id="pf_bagrow" style="display:'+((p&&p.unit==='bag')?'block':'none')+'"><label>'+esc(t('bag_kg_l'))+'<input id="pf_bag" type="number" inputmode="decimal" min="0" step="any" value="'+(p&&p.bag_kg?p.bag_kg:25)+'"></label>'
   +'<div class="chips">'+[25,24.5,50].map(function(w){return '<button type="button" class="btn chip-btn" data-w="'+w+'">'+w+' '+esc(t('unit_kg'))+'</button>'}).join('')+'</div><p class="avail" style="margin:8px 0 0">'+esc(t('bag_hint'))+'</p></div>'
   +'<label class="full" id="pf_newrow" style="display:none">'+esc(t('new_cat_ph'))+'<input id="pf_newcat" autocomplete="off"></label>'
   +'<label>'+esc(t('cost_price'))+' ('+esc(S().currency)+')<input id="pf_cost" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.cost_price:0)+'"></label>'
   +'<label>'+esc(t('sale_price'))+' ('+esc(S().currency)+')<input id="pf_sale" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.sale_price:0)+'"></label>'
   +'<label>'+esc(t('min_stock'))+'<input id="pf_min" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.min_stock:0)+'"></label>'
   +'<label class="chk" style="align-self:end;padding-bottom:10px"><input id="pf_active" type="checkbox"'+((!p||p.active)?' checked':'')+'>'+esc(t('is_active'))+'</label>'
   +'</div><div class="sec-sub">'+esc(t('col_stock'))+'</div><div class="fgrid">'+gInputs+'</div>'
   +'<p class="err" id="pf_err" role="alert"></p>'
   +'<div class="dlg-act"><button class="btn" data-r="x">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="save">'+esc(t('save'))+'</button></div>',true);
  var $=function(i){return o.querySelector('#'+i)};
  o.addEventListener('change',function(e){
    if(e.target.id==='pf_cat'){$('pf_newrow').style.display=e.target.value==='__new'?'grid':'none'}
    if(e.target.id==='pf_unit'){$('pf_bagrow').style.display=e.target.value==='bag'?'block':'none'}
  });
  o.addEventListener('click',function(e){
    var w=e.target.closest('[data-w]');if(w){$('pf_bag').value=w.dataset.w;return}
    var b=e.target.closest('[data-r]');
    if(e.target===o||(b&&b.dataset.r==='x')){o.close();return}
    if(!b||b.dataset.r!=='save')return;
    var D2=DB.data,name=$('pf_name').value.trim(),sku=$('pf_sku').value.trim(),bc=$('pf_bc').value.trim();
    var cost=numVal($('pf_cost').value),sale=numVal($('pf_sale').value),min=numVal($('pf_min').value),err='';
    var badStock=false;o.querySelectorAll('.pf_g').forEach(function(i){var v=numVal(i.value);if(!(v>=0))badStock=true});
    if(!name)err=t('err_name');
    else if(!(cost>=0)||!(sale>=0)||!(min>=0)||badStock)err=t('err_price');
    else if($('pf_unit').value==='bag'&&!(numVal($('pf_bag').value)>0))err=t('err_bag');
    else if(sku&&D2.products.some(function(x){return x.sku===sku&&(!p||x.id!==p.id)}))err=t('err_sku');
    else if(bc&&D2.products.some(function(x){return x.barcode===bc&&(!p||x.id!==p.id)}))err=t('err_barcode');
    $('pf_err').textContent=err;
    if(err){var f=$('pf_name');if(!name)f.focus();return}
    var commit=function(){
      var catId=$('pf_cat').value?Number($('pf_cat').value):null;
      if($('pf_cat').value==='__new'){
        var nn=$('pf_newcat').value.trim();catId=null;
        if(nn){var ex=D2.categories.find(function(c){return c.name.toLowerCase()===nn.toLowerCase()});catId=ex?ex.id:DB.insert('categories',{name:nn}).id}
      }
      var row={name:name,sku:sku||DB.nextSku(),barcode:bc,category_id:catId,unit:$('pf_unit').value,bag_kg:$('pf_unit').value==='bag'?numVal($('pf_bag').value):0,cost_price:cost,sale_price:sale,min_stock:min,active:$('pf_active').checked};
      var saved=p?DB.update('products',p.id,row):DB.insert('products',row);
      o.querySelectorAll('.pf_g').forEach(function(i){DB.setStock(saved.id,Number(i.dataset.g),numVal(i.value),p?'edit':'opening')});
      o.close();render(true);toast(t('saved_product'));
    };
    if(sale<cost){confirmBox(t('warn_loss')).then(function(ok){if(ok)commit()})}else commit();
  });
  $('pf_name').focus();
}

function deleteProduct(id){
  var D=DB.data,p=DB.get('products',id);if(!p)return;
  var n=D.sale_items.filter(function(i){return i.product_id===id}).length;
  if(n){toast(t('delete_blocked').replace('{n}',n));return}
  confirmBox(t('delete_confirm').replace('{name}',p.name)).then(function(ok){
    if(!ok)return;
    DB.data.stock.filter(function(r){return r.product_id===id}).map(function(r){return r.id}).forEach(function(sid){DB.remove('stock',sid)});
    DB.remove('products',id);render(true);toast(t('deleted_product'));
  });
}

function openCategories(){
  var o=openModal('',true);
  function draw(){
    var D=DB.data;
    var rows=D.categories.map(function(c){
      var n=D.products.filter(function(p){return p.category_id===c.id}).length;
      return '<div class="catrow"><input class="txt" data-cid="'+c.id+'" value="'+esc(c.name)+'"><span class="n"><bdi dir="ltr">'+n+'</bdi></span><button class="icon-btn" data-cdel="'+c.id+'" aria-label="'+esc(t('delete'))+'">'+ic('trash')+'</button></div>';
    }).join('');
    o.firstChild.innerHTML='<h3>'+esc(t('cat_title'))+'</h3>'+rows
     +'<div class="catrow" style="margin-top:14px"><input class="txt" id="cat_new" placeholder="'+esc(t('cat_ph'))+'" autocomplete="off"><button class="btn btn-primary" data-cadd="1">'+esc(t('cat_add'))+'</button></div>'
     +'<div class="dlg-act" style="margin-top:18px"><button class="btn" data-cclose="1">'+esc(t('close'))+'</button></div>';
  }
  draw();
  function finish(){o.close();render(true)}
  o.addEventListener('click',function(e){
    if(e.target===o||e.target.closest('[data-cclose]')){finish();return}
    var d=e.target.closest('[data-cdel]');
    if(d){
      var id=Number(d.dataset.cdel),n=DB.data.products.filter(function(p){return p.category_id===id}).length;
      if(n){toast(t('cat_in_use').replace('{n}',n));return}
      DB.remove('categories',id);draw();return;
    }
    if(e.target.closest('[data-cadd]')){
      var inp=o.querySelector('#cat_new'),v=inp.value.trim();if(!v)return;
      var ex=DB.data.categories.some(function(c){return c.name.toLowerCase()===v.toLowerCase()});
      if(!ex)DB.insert('categories',{name:v});draw();
    }
  });
  o.addEventListener('change',function(e){
    var i=e.target.closest('[data-cid]');if(!i)return;
    var v=i.value.trim();if(v)DB.update('categories',Number(i.dataset.cid),{name:v});else draw();
  });
  o.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cat_new'){e.preventDefault();o.querySelector('[data-cadd]').click()}});
}

/* ===================== PART 3: GODOWN ===================== */
function fmtDate(iso){var d=new Date(iso);if(isNaN(d))return '';function z(n){return String(n).padStart(2,'0')}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())}
function stockMap(){var m={};DB.data.stock.forEach(function(r){(m[r.product_id]=m[r.product_id]||{})[r.godown_id]=r.qty});return m}
function avail(pid,gid){var r=DB.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});return r?r.qty:0}
function godownStats(gid){
  var prod={},n=0,q=0,v=0,kg=0;
  DB.data.products.forEach(function(p){prod[p.id]=p});
  DB.data.stock.forEach(function(r){
    if(r.godown_id!==gid)return;var p=prod[r.product_id];if(!p||!p.active)return;
    if(r.qty>0)n++;q+=r.qty;v+=r.qty*p.cost_price;kg+=weightKg(p,r.qty);
  });
  return {n:n,q:q,v:v,kg:kg};
}
function sortedProducts(){return DB.data.products.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))})}
function productOptions(sel){return sortedProducts().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+(p.sku?' ('+esc(p.sku)+')':'')+'</option>'}).join('')}
function godownOptions(sel){return DB.data.godowns.map(function(g){return '<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+esc(g.name)+'</option>'}).join('')}

function gFilter(){
  var q=state.gq.trim().toLowerCase();
  return sortedProducts().filter(function(p){return !q||(p.name||'').toLowerCase().indexOf(q)>=0||(p.sku||'').toLowerCase().indexOf(q)>=0||(p.barcode||'').toLowerCase().indexOf(q)>=0});
}
function godownCols(){return state.gsel==='all'?4+DB.data.godowns.length:6}
function godownRows(list){
  var D=DB.data,sm=stockMap(),gs=state.gsel;
  if(!list.length)return '<tr><td colspan="'+godownCols()+'" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(p){
    var per=sm[p.id]||{},tot=0;Object.keys(per).forEach(function(k){tot+=per[k]});
    var low=p.active&&tot<=p.min_stock,cells;
    if(gs==='all'){
      cells=D.godowns.map(function(g){return '<td class="n"><bdi dir="ltr">'+qtyFmt(per[g.id]||0)+'</bdi></td>'}).join('')
        +'<td class="n"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(tot)+'</bdi></span>'+kgSub(p,tot)+'</td>';
    }else{
      var q=per[gs]||0;
      cells='<td class="n"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(q)+'</bdi></span>'+kgSub(p,q)+'</td><td class="n"><bdi dir="ltr">'+qtyFmt(p.min_stock)+'</bdi></td><td class="n"><bdi dir="ltr">'+fmt(q*p.cost_price)+'</bdi></td>';
    }
    var g=gs==='all'?'':gs;
    return '<tr><td><strong>'+esc(p.name)+'</strong><div class="sub">'+esc(p.sku||'')+(p.active?'':' \u00B7 '+esc(t('inactive')))+'</div></td><td>'+esc(unitFull(p))+'</td>'+cells
     +'<td class="act"><button class="icon-btn" data-act="gtransfer" data-p="'+p.id+'" data-g="'+g+'" aria-label="'+esc(t('transfer'))+'">'+ic('transfer')+'</button><button class="icon-btn" data-act="gadjust" data-p="'+p.id+'" data-g="'+g+'" aria-label="'+esc(t('adjust_stock'))+'">'+ic('edit')+'</button></td></tr>';
  }).join('');
}
function godownHead(){
  var D=DB.data,h='<th>'+esc(t('col_product'))+'</th><th>'+esc(t('col_unit'))+'</th>';
  if(state.gsel==='all')h+=D.godowns.map(function(g){return '<th>'+esc(g.name)+'</th>'}).join('')+'<th>'+esc(t('col_total'))+'</th>';
  else h+='<th>'+esc(t('col_qty'))+'</th><th>'+esc(t('col_min'))+'</th><th>'+esc(t('col_value'))+'</th>';
  return h+'<th></th>';
}
function movesRows(){
  var D=DB.data,pn={},gn={};
  D.products.forEach(function(p){pn[p.id]=p.name});D.godowns.forEach(function(g){gn[g.id]=g.name});
  var list=D.stock_moves.filter(function(m){return state.gsel==='all'||m.godown_id===state.gsel}).slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:b.id-a.id)}).slice(0,100);
  if(!list.length)return '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">'+esc(t('no_moves'))+'</td></tr>';
  return list.map(function(m){
    var inn=m.type==='in'||m.type==='transfer_in';
    var note=(m.reason?t('rs_'+m.reason):'')+(m.note?(m.reason?' \u00B7 ':'')+m.note:'');
    return '<tr><td class="n"><bdi dir="ltr">'+esc(fmtDate(m.date))+'</bdi></td><td>'+esc(pn[m.product_id]||'\u2014')+'</td><td>'+esc(gn[m.godown_id]||'\u2014')+'</td>'
     +'<td><span class="tag '+(inn?'ok':'warn')+'">'+esc(t('mv_'+m.type))+'</span></td>'
     +'<td class="n '+(inn?'sgn-in':'sgn-out')+'"><bdi dir="ltr">'+(inn?'+':'\u2212')+qtyFmt(m.qty)+'</bdi></td><td>'+esc(note)+'</td></tr>';
  }).join('');
}

function godownView(){
  var D=DB.data;
  var head='<div class="page-head"><div><h1>'+esc(t('nav_godown'))+'</h1><p class="muted">'+esc(t('god_sub'))+'</p></div>'
   +'<div class="btn-row" style="margin:0"><button class="btn" data-act="gtransfer" data-p="" data-g="">'+ic('transfer')+esc(t('transfer'))+'</button><button class="btn" data-act="gadjust" data-p="" data-g="">'+ic('edit')+esc(t('adjust_stock'))+'</button><button class="btn btn-primary" data-act="gadd">'+ic('plus')+esc(t('add_godown'))+'</button></div></div>';
  if(!D.godowns.length)return head+'<div class="banner"><div><strong>'+esc(t('no_godowns'))+'</strong><p>'+esc(t('no_godowns_text'))+'</p></div><div class="btn-row" style="margin:0"><button class="btn btn-primary" data-act="gadd">'+esc(t('add_godown'))+'</button><button class="btn" data-act="demo">'+esc(t('load_demo'))+'</button></div></div>';
  if(state.gsel!=='all'&&!DB.get('godowns',state.gsel))state.gsel='all';

function z2(n){return String(n).padStart(2,'0')}
function dayStr(d){d=d||new Date();return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())}
function fmtDay(iso){return iso?fmtDate(iso).slice(0,10):''}
function dateToIso(v){var d=v?new Date(v+'T12:00:00'):new Date();return isNaN(d)?new Date().toISOString():d.toISOString()}
function byName(a,b){return String(a.name).localeCompare(String(b.name))}
function mv(v){return '<bdi dir="ltr">'+fmt(v)+'</bdi>'}
function wireModal(o,onSave,onCancel){
  o.addEventListener('click',function(e){
    var b=e.target.closest('[data-r]');
    if(e.target===o||(b&&b.dataset.r==='x')){o.close();if(onCancel)onCancel();return}
    if(b&&b.dataset.r==='save')onSave();
  });
}
function btnRow(saveKey){return '<p class="err" role="alert" id="m_err"></p><div class="dlg-act"><button class="btn" data-r="x">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="save">'+esc(t(saveKey||'save'))+'</button></div>'}

function cFilter(){
  var q=state.cq.trim().toLowerCase(),st=RP.customerStats(DB.data);
  return DB.data.customers.filter(function(c){
    var s=st[c.id]||{balance:0},act=c.active!==false;
    if(state.cstat==='owing'&&!(s.balance>0.004))return false;
    if(state.cstat==='inactive'&&act)return false;
    if(state.cstat==='active'&&!act)return false;
    if(q&&(c.name||'').toLowerCase().indexOf(q)<0&&(c.phone||'').toLowerCase().indexOf(q)<0&&(c.address||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(byName);
}

   +'<div class="sec-sub">'+esc(t('payments_h'))+'</div><div class="tbl-wrap"><table><thead><tr><th>'+esc(t('col_date'))+'</th><th>'+esc(t('col_amount'))+'</th><th>'+esc(t('col_note'))+'</th></tr></thead><tbody>'+pRows+'</tbody></table></div>'

/* ---------- staff ---------- */
var SSUM=[{k:'sum_staff',tone:'ink',icon:'users'},{k:'sum_monthly',tone:'blue',icon:'wallet',money:1},{k:'staff_payable',tone:'amber',icon:'briefcase',money:1},{k:'sum_paid_month',tone:'green',icon:'coin',money:1}];
function sFilter(){
  var q=state.sq.trim().toLowerCase();
  return DB.data.staff.filter(function(s){
    var act=s.active!==false;
    if(state.sstat==='active'&&!act)return false;
    if(state.sstat==='inactive'&&act)return false;
    if(q&&(s.name||'').toLowerCase().indexOf(q)<0&&(s.role||'').toLowerCase().indexOf(q)<0&&(s.phone||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(byName);
}
function balCell(b){
  if(b>0.004)return '<span class="neg-t">'+mv(b)+'</span>';
  if(b<-0.004)return '<span class="pos-t">'+mv(-b)+'</span> <span class="tag ok">'+esc(t('ledger_advance'))+'</span>';
  return mv(0);
}
function staffRows(list){
  var bal=RP.staffBalances(DB.data);
  if(!list.length)return '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(s){
    var act=s.active!==false,b=(bal[s.id]||{balance:0}).balance;
    return '<tr><td><strong>'+esc(s.name)+'</strong><div class="sub">'+esc(s.phone||'')+'</div></td><td>'+esc(s.role||'')+'</td><td class="n">'+mv(s.salary)+'</td>'
     +'<td class="n"><bdi dir="ltr">'+esc(fmtDay(s.hired_at))+'</bdi></td><td class="n">'+balCell(b)+'</td>'
     +'<td><span class="tag '+(act?'ok':'off')+'">'+esc(t(act?'active':'inactive'))+'</span></td>'
     +'<td class="act"><button class="icon-btn" data-act="sview" data-id="'+s.id+'" aria-label="'+esc(t('ledger_title'))+'">'+ic('eye')+'</button>'
     +'<button class="icon-btn" data-act="spay" data-id="'+s.id+'" aria-label="'+esc(t('pay_salary'))+'">'+ic('coin')+'</button>'
     +'<button class="icon-btn" data-act="sedit" data-id="'+s.id+'" aria-label="'+esc(t('edit'))+'">'+ic('edit')+'</button>'
     +'<button class="icon-btn" data-act="sdel" data-id="'+s.id+'" aria-label="'+esc(t('delete'))+'">'+ic('trash')+'</button></td></tr>';
  }).join('');
}
function refreshStaffList(){
  var b=document.getElementById('staffBody');if(!b)return;
  var list=sFilter();b.innerHTML=staffRows(list);
  var n=document.getElementById('staffCount');if(n)n.textContent=countNote(list);
}
function staffView(){
  var D=DB.data,c=RP.compute(D,'lifetime','all');
  var head='<div class="page-head"><div><h1>'+esc(t('nav_staff'))+'</h1><p class="muted">'+esc(t('staff_sub'))+'</p></div>'
   +'<div class="btn-row" style="margin:0"><button class="btn" data-act="smonth">'+ic('plus')+esc(t('smonth'))+'</button><button class="btn btn-primary" data-act="sadd">'+ic('plus')+esc(t('add_staff'))+'</button></div></div>';
  if(!D.staff.length)return head+'<div class="banner"><div><strong>'+esc(t('no_products'))+'</strong><p>'+esc(t('staff_sub'))+'</p></div><div class="btn-row" style="margin:0"><button class="btn btn-primary" data-act="sadd">'+esc(t('add_staff'))+'</button><button class="btn" data-act="demo">'+esc(t('load_demo'))+'</button></div></div>';
  var now=new Date(),ym=now.getFullYear()*12+now.getMonth(),monthly=0,paidM=0;
  D.staff.forEach(function(s){if(s.active!==false)monthly+=s.salary});
  D.staff_tx.forEach(function(x){if(x.type==='payment'){var d=new Date(x.date);if(d.getFullYear()*12+d.getMonth()===ym)paidM+=x.amount}});
  var vals={sum_staff:c.staff_total,sum_monthly:monthly,staff_payable:c.staff_payable,sum_paid_month:paidM};
  var sOpts=[['all','f_all'],['active','f_active'],['inactive','f_inactive']].map(function(x){return '<option value="'+x[0]+'"'+(state.sstat===x[0]?' selected':'')+'>'+esc(t(x[1]))+'</option>'}).join('');
  var list=sFilter();
  return head+'<div class="grid g4" style="margin-top:18px">'+SSUM.map(function(d){return card(d,vals[d.k])}).join('')+'</div>'
   +'<div class="toolbar"><label class="grow">'+ic('search')+'<input id="sq" type="search" autocomplete="off" placeholder="'+esc(t('search_staff'))+'" value="'+esc(state.sq)+'"></label>'
   +'<label class="pill"><select data-act="sstat" aria-label="'+esc(t('col_status'))+'">'+sOpts+'</select></label></div>'
   +'<div class="panel" style="margin-top:0"><div class="tbl-wrap"><table><thead><tr>'+['col_name','col_role','col_salary','col_hired','col_balance','col_status'].map(function(k){return '<th>'+esc(t(k))+'</th>'}).join('')+'<th></th></tr></thead>'
   +'<tbody id="staffBody">'+staffRows(list)+'</tbody></table></div><p class="count-note" id="staffCount">'+esc(countNote(list))+'</p></div>';
}
function openStaffForm(id,after){
  var s=id?DB.get('staff',id):null;
  var o=openModal('<h3>'+esc(t(s?'form_staff_edit':'form_staff_add'))+'</h3><div class="fgrid">'
   +'<label class="full">'+esc(t('col_name'))+'<input id="sf_name" value="'+esc(s?s.name:'')+'" autocomplete="off"></label>'
   +'<label>'+esc(t('col_role'))+'<input id="sf_role" value="'+esc(s?s.role:'')+'" autocomplete="off"></label>'
   +'<label>'+esc(t('col_phone'))+'<input id="sf_phone" dir="ltr" inputmode="tel" value="'+esc(s?s.phone:'')+'"></label>'
   +'<label>'+esc(t('st_salary'))+' ('+esc(S().currency)+')<input id="sf_sal" type="number" inputmode="decimal" min="0" step="any" value="'+(s?s.salary:0)+'"></label>'
   +'<label>'+esc(t('col_hired'))+'<input id="sf_hired" type="date" value="'+(s&&s.hired_at?dayStr(new Date(s.hired_at)):dayStr())+'"></label>'
   +'<label class="chk full"><input id="sf_active" type="checkbox"'+((!s||s.active!==false)?' checked':'')+'>'+esc(t('st_active'))+'</label></div>'+btnRow());
  var $=function(i){return o.querySelector('#'+i)};
  wireModal(o,function(){
    var name=$('sf_name').value.trim(),sal=numVal($('sf_sal').value),err='';
    if(!name)err=t('err_staff_name');else if(!(sal>=0))err=t('err_salary');
    $('m_err').textContent=err;if(err)return;
    var row={name:name,role:$('sf_role').value.trim(),phone:$('sf_phone').value.trim(),salary:sal,hired_at:dateToIso($('sf_hired').value),active:$('sf_active').checked};
    if(s)DB.update('staff',s.id,row);else DB.insert('staff',row);
    o.close();render(true);toast(t('saved_staff'));if(after)after();
  },after);
  $('sf_name').focus();
}
function deleteStaff(id){
  var s=DB.get('staff',id);if(!s)return;
  if(DB.data.staff_tx.some(function(x){return x.staff_id===id})){toast(t('del_staff_blocked'));return}
  confirmBox(t('del_staff_confirm').replace('{name}',s.name)).then(function(ok){if(ok){DB.remove('staff',id);render(true);toast(t('deleted_staff'))}});
}
function openStaffTx(sid,type,after){
  var s=DB.get('staff',sid);if(!s)return;
  var b=RP.staffBalances(DB.data)[sid].balance;
  var def=type==='payment'?(b>0?b:s.salary):s.salary;
  var o=openModal('<h3>'+esc(t(type==='payment'?'paysal_title':'acc_title'))+' \u2014 '+esc(s.name)+'</h3><p class="muted" style="margin:-8px 0 14px">'+esc(t('ledger_balance'))+': '+mv(b)+'</p><div class="fgrid">'
   +'<label>'+esc(t('pay_amount'))+' ('+esc(S().currency)+')<input id="tx_amt" type="number" inputmode="decimal" min="0" step="any" value="'+(def>0?def:'')+'"></label>'
   +'<label>'+esc(t('pay_date'))+'<input id="tx_date" type="date" value="'+dayStr()+'"></label>'
   +'<label class="full">'+esc(t('pay_note'))+'<input id="tx_note" autocomplete="off"></label></div>'+btnRow());
  var $=function(i){return o.querySelector('#'+i)};
  wireModal(o,function(){
    var amt=numVal($('tx_amt').value);
    if(!(amt>0)){$('m_err').textContent=t('err_pay_amount');return}
    var commit=function(){
      DB.insert('staff_tx',{staff_id:sid,type:type,amount:amt,reason:'',note:$('tx_note').value.trim(),date:dateToIso($('tx_date').value)});
      o.close();render(true);toast(t('saved_tx'));if(after)after();
    };
    var cur=RP.staffBalances(DB.data)[sid].balance;
    if(type==='payment'&&amt>Math.max(cur,0)+0.004)confirmBox(t('err_adv')).then(function(ok){if(ok)commit()});else commit();
  },after);
  $('tx_amt').focus();
}
function openStaffLedger(id){
  var D=DB.data,s=DB.get('staff',id);if(!s)return;
  var b=RP.staffBalances(D)[id];
  var tx=D.staff_tx.filter(function(x){return x.staff_id===id}).sort(function(a,c){return a.date<c.date?1:(a.date>c.date?-1:c.id-a.id)}).slice(0,100);
  var rows=tx.length?tx.map(function(x){
    var acc=x.type==='accrual',note=(x.reason?t('rs_'+x.reason):'')+(x.note?(x.reason?' \u00B7 ':'')+x.note:'');
    return '<tr><td class="n"><bdi dir="ltr">'+esc(fmtDay(x.date))+'</bdi></td><td><span class="tag '+(acc?'warn':'ok')+'">'+esc(t(acc?'ty_accrual':'ty_payment'))+'</span></td><td class="n">'+mv(x.amount)+'</td><td>'+esc(note)+'</td></tr>';
  }).join(''):'<tr><td colspan="4" class="muted">'+esc(t('no_ledger'))+'</td></tr>';
  var o=openModal('<h3>'+esc(s.name)+'</h3><p class="muted" style="margin:-8px 0 12px">'+esc([s.role,s.phone].filter(Boolean).join(' \u00B7 '))+'</p>'
   +'<div class="gstats c3"><div><span>'+esc(t('ledger_accrued'))+'</span><strong>'+mv(b.accrued)+'</strong></div><div><span>'+esc(t('ledger_paid'))+'</span><strong>'+mv(b.paid)+'</strong></div><div><span>'+esc(t(b.balance<-0.004?'ledger_advance':'ledger_balance'))+'</span><strong class="'+(b.balance>0.004?'neg-t':(b.balance<-0.004?'pos-t':''))+'">'+mv(Math.abs(b.balance))+'</strong></div></div>'
   +'<div class="btn-row" style="margin:0 0 6px"><button class="btn btn-primary" data-r="pay">'+ic('coin')+esc(t('pay_salary'))+'</button><button class="btn" data-r="acc">'+ic('plus')+esc(t('add_accrual'))+'</button><button class="btn" data-r="edit">'+ic('edit')+esc(t('edit'))+'</button></div>'
   +'<div class="sec-sub">'+esc(t('ledger_h'))+'</div><div class="tbl-wrap"><table><thead><tr><th>'+esc(t('col_date'))+'</th><th>'+esc(t('col_type'))+'</th><th>'+esc(t('col_amount'))+'</th><th>'+esc(t('col_note'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="dlg-act" style="margin-top:14px"><button class="btn" data-r="x">'+esc(t('close'))+'</button></div>',true);
  var back=function(){openStaffLedger(id)};
  o.addEventListener('click',function(e){
    var bt=e.target.closest('[data-r]');
    if(e.target===o||(bt&&bt.dataset.r==='x')){o.close();return}
    if(!bt)return;
    if(bt.dataset.r==='pay'){o.close();openStaffTx(id,'payment',back)}
    else if(bt.dataset.r==='acc'){o.close();openStaffTx(id,'accrual',back)}
    else if(bt.dataset.r==='edit'){o.close();openStaffForm(id,back)}
  });
}
function accrueMonth(){
  var D=DB.data,now=new Date(),mk=now.getFullYear()*12+now.getMonth(),todo=[];
  D.staff.forEach(function(s){
    if(s.active===false||!(s.salary>0))return;
    var has=D.staff_tx.some(function(x){var d=new Date(x.date);return x.staff_id===s.id&&x.type==='accrual'&&x.reason==='monthly'&&d.getFullYear()*12+d.getMonth()===mk});
    if(!has)todo.push(s);
  });
  if(!todo.length){toast(t('smonth_none'));return}
  confirmBox(t('smonth_confirm')).then(function(ok){
    if(!ok)return;
    todo.forEach(function(s){DB.insert('staff_tx',{staff_id:s.id,type:'accrual',amount:s.salary,reason:'monthly',note:'',date:new Date().toISOString()})});
    render(true);toast(t('smonth_done').replace('{n}',todo.length));
  });
}

function setSetting(k,v){DB.data.settings[k]=v;DB.save()}

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.tagName==='SELECT')return;
  var a=el.dataset.act;
  if(a==='nav'){state.view=el.dataset.v;state.mobile=false;state.bell=false;render(false)}
  else if(a==='collapse'){state.collapsed=!state.collapsed;render(true)}
  else if(a==='menu'){state.mobile=!state.mobile;render(true)}
  else if(a==='theme'){setSetting('theme',effTheme()==='dark'?'light':'dark');render(true)}
  else if(a==='bell'){state.bell=!state.bell;render(true)}
  else if(a==='tab'){state.tab=el.dataset.v;render(false)}
  else if(a==='padd'){openProductForm()}
  else if(a==='pedit'){openProductForm(Number(el.dataset.id))}
  else if(a==='pdel'){deleteProduct(Number(el.dataset.id))}
  else if(a==='pcats'){openCategories()}
  else if(a==='cuadd'){openCustomerForm()}
  else if(a==='cuedit'){openCustomerForm(Number(el.dataset.id))}
  else if(a==='cudel'){deleteCustomer(Number(el.dataset.id))}
  else if(a==='cuview'){openCustomerAccount(Number(el.dataset.id))}
  else if(a==='cupay'){openReceivePayment(Number(el.dataset.id))}
  else if(a==='sadd'){openStaffForm()}
  else if(a==='sedit'){openStaffForm(Number(el.dataset.id))}
  else if(a==='sdel'){deleteStaff(Number(el.dataset.id))}
  else if(a==='sview'){openStaffLedger(Number(el.dataset.id))}
  else if(a==='spay'){openStaffTx(Number(el.dataset.id),'payment')}
  else if(a==='smonth'){accrueMonth()}
  else if(a==='gadd'){openGodownForm()}
  else if(a==='gedit'){openGodownForm(Number(el.dataset.id))}
  else if(a==='gdel'){deleteGodown(Number(el.dataset.id))}
  else if(a==='gview'){state.gsel=Number(el.dataset.id);state.gtab='stock';render(true)}
  else if(a==='gtab'){state.gtab=el.dataset.v;render(true)}
  else if(a==='gtransfer'){openTransfer(el.dataset.p?Number(el.dataset.p):0,el.dataset.g?Number(el.dataset.g):0)}
  else if(a==='gadjust'){openAdjust(el.dataset.p?Number(el.dataset.p):0,el.dataset.g?Number(el.dataset.g):0)}
  else if(a==='save-general'){
    var shop=document.getElementById('f_shop').value.trim()||'RetailPro';
    var cash=parseFloat(document.getElementById('f_cash').value);
    DB.data.settings.shopName=shop;
    DB.data.settings.lang=document.getElementById('f_lang').value;
    DB.data.settings.theme=document.getElementById('f_theme').value;
    DB.data.settings.openingCash=isFinite(cash)&&cash>=0?cash:0;
    DB.save();render(true);toast(t('saved'));
  }
  else if(a==='demo'){
    var go=function(){DB.loadDemo();state.exportText='';render(true);toast(t('demo_ok'))};
    if(DB.count('products')||DB.count('sales')){confirmBox(t('demo_confirm')).then(function(ok){if(ok)go()})}else go();
  }
  else if(a==='clear'){confirmBox(t('clear_confirm')).then(function(ok){if(ok){DB.clearAll();state.exportText='';render(true);toast(t('cleared'))}})}
  else if(a==='export'){state.exportText=DB.exportText();render(true)}
  else if(a==='copy'){
    var box=document.getElementById('exportBox');if(!box)return;
    var done=function(){toast(t('copied'))};
    box.focus();box.select();
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(box.value).then(done,function(){document.execCommand('copy');done()})}else{document.execCommand('copy');done()}}catch(err){try{document.execCommand('copy');done()}catch(e2){}}
  }
  else if(a==='import'){
    var txt=document.getElementById('importBox').value.trim();
    if(txt&&DB.importText(txt)){state.exportText='';render(true);toast(t('import_ok'))}else toast(t('import_bad'));
  }
});
root.addEventListener('change',function(e){
  var el=e.target.closest('select[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='period'){state.period=el.value;render(true)}
  else if(a==='gid'){state.gid=el.value==='all'?'all':Number(el.value);render(true)}
  else if(a==='lang'){setSetting('lang',el.value);render(true)}
  else if(a==='pcat'){state.pcat=el.value;render(true)}
  else if(a==='pstat'){state.pstat=el.value;render(true)}
  else if(a==='gsel'){state.gsel=el.value==='all'?'all':Number(el.value);render(true)}
  else if(a==='cstat'){state.cstat=el.value;render(true)}
  else if(a==='sstat'){state.sstat=el.value;render(true)}
});
root.addEventListener('input',function(e){
  if(e.target.id==='pq'){state.pq=e.target.value;refreshProductList()}
  else if(e.target.id==='gq'){state.gq=e.target.value;refreshGodownList()}
  else if(e.target.id==='cq'){state.cq=e.target.value;refreshCustomerList()}
  else if(e.target.id==='sq'){state.sq=e.target.value;refreshStaffList()}
});
root.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pq'){var l=prodFilter();if(l.length===1)openProductForm(l[0].id);return}
  if(e.key==='Enter'&&e.target.id==='cq'){var l2=cFilter();if(l2.length===1)openCustomerAccount(l2[0].id);return}
  if(e.key==='Enter'&&e.target.id==='sq'){var l3=sFilter();if(l3.length===1)openStaffLedger(l3[0].id);return}
  if(e.key==='Enter'&&e.target.id==='q'){
    var q=e.target.value.trim().toLowerCase();if(!q)return;
    var hit=NAV.filter(function(n){return n[0].indexOf(q)>=0||t('nav_'+n[0]).toLowerCase().indexOf(q)>=0})[0];
    if(hit){state.view=hit[0];state.bell=false;render(false)}
  }
});
document.addEventListener('click',function(e){
  if(state.bell&&!e.target.closest('.bell-wrap')){state.bell=false;render(true)}
});

DB.load();
render(false);
})();
